spring.application.name=leetcode


server.port=8789

# DataSource settings: set here configurations for the database connection
spring.datasource.url=jdbc:mysql://localhost:3306/hibernate?serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=12Rose#2323
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Specify the JPA dialect for MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Hibernate Logging
logging.level.org.hibernate.SQL=DEBUG
aws.accessKey=your-access-key
aws.secretKey=your-secret-key
aws.region=us-east-1
aws.bucketName=your-bucket-name